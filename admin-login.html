<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | CourseHub</title>

   <link
    rel="stylesheet"
    href="admin-login.css"
>
</head>


<body class="admin-login-page">

    <div class="admin-login-wrapper">

        <div class="admin-login-card">

            <div class="admin-login-icon">
    <div class="admin-shield">
        <span>✓</span>
    </div>
</div>

            <h1>
                Admin Login
            </h1>

            <p class="admin-login-subtitle">
                Login to manage your courses
            </p>


            <form id="admin-login-form">

                <div class="admin-input-group">

                    <label for="admin-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="admin@example.com"
                        required
                    >

                </div>


                <div class="admin-input-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="admin-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-admin-password"
                            class="password-toggle"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Login to Admin Panel
                </button>


                <p
                    id="admin-login-message"
                    class="admin-login-message"
                ></p>

            </form>


            <a
                href="index.html"
                class="back-to-website"
            >
                ← Back to Website
            </a>

        </div>

    </div>


    <script src="admin-login.js"></script>


    <script>

        const passwordInput =
            document.getElementById("admin-password");

        const togglePassword =
            document.getElementById("toggle-admin-password");


        togglePassword.addEventListener("click", () => {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "👁️";

            }

        });

    </script>

</body>

</html>
